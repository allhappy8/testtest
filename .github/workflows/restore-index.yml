name: Restore index.html with tracking tag
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore index.html and add tracking tag
        run: |
          set -euo pipefail
          git config user.name "allhappy8"
          git config user.email "allhappy8@users.noreply.github.com"
          git show 3cf3e5d:index.html > index.html
          test "$(grep -c '</head>' index.html)" = 1
          sed -i 's|</head>|<script src="https://track.zanmai-time.com/t.js?school=sanyo\&ev=lp_view" async></script></head>|' index.html
          test "$(grep -c 'track.zanmai-time.com/t.js?school=sanyo&ev=lp_view' index.html)" = 1
          rm .github/workflows/restore-index.yml
          git add -A
          git status --short
          git commit -m "Add tracking tag (zanmai-time lp_view)"
          git push origin HEAD:main
